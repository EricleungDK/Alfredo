[package]
name = "alfredo-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Alfredo native Rust terminal workstation"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }

unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[profile.release]
lto = "thin"
strip = true
