name: Daily Codex dead-code cleanup

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: Europe/Copenhagen
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-codex-dead-code-cleanup
  cancel-in-progress: false

jobs:
  preflight:
    name: Avoid overlapping cleanup pull requests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_open_cleanup: ${{ steps.open-pull.outputs.present }}
    steps:
      - name: Check for an existing automated cleanup PR
        id: open-pull
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = pulls.find((pull) =>
              pull.head.ref.startsWith("codex/dead-code-")
            );
            core.setOutput("present", existing ? "true" : "false");
            if (existing) {
              core.notice(`Skipping while ${existing.html_url} awaits review.`);
            }

  cleanup:
    name: Find, verify, and propose dead-code removal
    needs: preflight
    if: needs.preflight.outputs.has_open_cleanup != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Require the Codex API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if test -z "${OPENAI_API_KEY}"; then
            echo "::error::Add an OPENAI_API_KEY repository secret before enabling this workflow."
            exit 1
          fi

      - name: Install locked JavaScript dependencies
        working-directory: mission-control
        run: npm ci

      - name: Create a fresh cleanup branch
        id: branch
        shell: bash
        run: |
          BRANCH_NAME="codex/dead-code-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git switch --create "${BRANCH_NAME}"
          echo "name=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Run Codex cleanup
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/daily-dead-code-cleanup.md
          output-file: ${{ runner.temp }}/codex-dead-code-summary.md
          model: gpt-5.6-sol
          effort: high
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      - name: Detect a proposed cleanup
        id: changes
        shell: bash
        run: |
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Codex found no sufficiently proven dead code in this run."
          fi

      - name: Enforce cleanup scope
        if: steps.changes.outputs.present == 'true'
        shell: bash
        run: |
          git diff --check

          if test -n "$(git ls-files --others --exclude-standard)"; then
            echo "::error::Dead-code cleanup must not add untracked files."
            git ls-files --others --exclude-standard
            exit 1
          fi

          if git diff --name-only -- .github/workflows .github/codex/prompts | grep -q .; then
            echo "::error::The cleanup run may not modify its own workflow or prompt."
            exit 1
          fi

          CHANGED_FILES="$(git diff --name-only | wc -l)"
          if test "${CHANGED_FILES}" -gt 8; then
            echo "::error::Cleanup exceeded the 8-file review limit."
            exit 1
          fi

          if git diff --numstat | grep -Eq '^[-]'; then
            echo "::error::Binary changes are not allowed in dead-code cleanup."
            exit 1
          fi

          CHANGED_LINES="$(git diff --numstat | awk '{ total += $1 + $2 } END { print total + 0 }')"
          if test "${CHANGED_LINES}" -gt 800; then
            echo "::error::Cleanup exceeded the 800-line review limit."
            exit 1
          fi

      - name: Run repository verification
        if: steps.changes.outputs.present == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm --prefix mission-control test -- --run
          npm --prefix mission-control run typecheck
          cargo fmt --manifest-path mission-control/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path mission-control/src-tauri/Cargo.toml

      - name: Commit and push the verified cleanup
        if: steps.changes.outputs.present == 'true'
        id: publish
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: remove verified dead code"
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH_NAME}"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Open a reviewable pull request
        if: steps.changes.outputs.present == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          CODEX_SUMMARY: ${{ steps.codex.outputs.final-message }}
          CLEANUP_COMMIT: ${{ steps.publish.outputs.commit }}
        with:
          github-token: ${{ github.token }}
          script: |
            const summary = (process.env.CODEX_SUMMARY || "Codex completed a verified dead-code cleanup.")
              .slice(0, 50000);
            const body = [
              "This draft PR was created automatically by the daily Codex dead-code cleanup.",
              "It is intentionally never auto-merged.",
              "",
              summary,
              "",
              "## Workflow verification",
              "",
              "The workflow independently passed the Python test suite, frontend test suite, TypeScript type-check, Rust formatting check, and Rust test suite before pushing this branch.",
              "",
              `Cleanup commit: ${process.env.CLEANUP_COMMIT}`,
            ].join("\n");

            const { data: pull } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: process.env.BRANCH_NAME,
              base: context.payload.repository.default_branch,
              title: `chore: remove verified dead code (${new Date().toISOString().slice(0, 10)})`,
              body,
              draft: true,
              maintainer_can_modify: true,
            });

            core.notice(`Created draft pull request ${pull.html_url}`);
