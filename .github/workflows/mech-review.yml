name: mech-review

# Mechanical PR review: test-diff guard, red-first, determinism, mutation. See docs/agents/testing.md.
# @v0 follows ekit's releases (each vX.Y.Z tag moves v0 after ek's tests pass): no bump PR here per release.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  mech-review:
    uses: EricleungDK/ekit/.github/workflows/mech-review.yml@v0
    with:
      stack: rust
      rust-toolchain: 1.96.0
      project-dir: alfredo-tui
      test-paths: |
        alfredo-tui/tests/**
      protected-paths: |
        .github/**
        AGENTS.md
        docs/agents/**
        alfredo-tui/scripts/agent-*
        alfredo-tui/.cargo/**
      agent-branch-prefix: claude/
      mutation-budget: "25"
      extra-apt-packages: bubblewrap util-linux
      # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces that bwrap needs.
      setup-command: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
