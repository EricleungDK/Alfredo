name: Rust terminal regression

on:
  pull_request:
    paths:
      - 'LICENSE'
      - 'alfredo-tui/**'
      - '.github/workflows/rust-terminal.yml'
  push:
    # PR branches are covered by the pull_request run; push runs only on main.
    branches: [main]
    paths:
      - 'LICENSE'
      - 'alfredo-tui/**'
      - '.github/workflows/rust-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-terminal-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.96.0
  CARGO_TERM_COLOR: always
  MANIFEST: alfredo-tui/Cargo.toml

jobs:
  # Lint, unit tests and dependency audit. Runs in parallel with `smokes`.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Cache Cargo registry, dependencies and tools
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: alfredo-tui -> target
          cache-bin: true
      - name: Install worker sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces that bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net true
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path "$MANIFEST"
      - name: Dependency notice integrity tests
        run: python3 -m unittest discover -s alfredo-tui/tests -p 'test_*.py'
      - name: Install dependency auditor
        run: |
          cargo audit --version 2>/dev/null | grep -q ' 0\.22\.2$' \
            || cargo install cargo-audit --version 0.22.2 --locked --force
      - name: Audit locked dependencies
        working-directory: alfredo-tui
        run: cargo audit --file Cargo.lock --deny warnings --json > dependency-audit.json
      - name: Verify audit failure gate
        run: python3 alfredo-tui/tests/audit_smoke.py
      - name: Retain dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfredo-terminal-dependency-audit
          path: alfredo-tui/dependency-audit.json
          if-no-files-found: warn

  # Debug build plus the PTY/headless/eval smokes. Runs in parallel with `checks`.
  smokes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Cache Cargo registry, dependencies and tools
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: alfredo-tui -> target
          cache-bin: true
      - name: Install worker sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces that bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net true
      - name: Build debug binary
        run: cargo build --locked --manifest-path "$MANIFEST"
      - name: PTY smoke - terminal
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/terminal_smoke.py
      - name: PTY smoke - autopilot
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/autopilot_terminal_smoke.py
      - name: Headless smoke - go without a TTY
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/headless_smoke.py
      - name: PTY smoke - inference
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/inference_terminal_smoke.py
      - name: PTY smoke - num-ctx
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/num_ctx_terminal_smoke.py
      - name: PTY smoke - compaction
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/compaction_terminal_smoke.py
      - name: PTY smoke - chat tools
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/chat_tools_terminal_smoke.py
      - name: PTY smoke - recovery
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/recovery_terminal_smoke.py
      - name: PTY smoke - qualification CLI
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/qualification_cli_smoke.py
      - name: PTY smoke - agent view
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/agent_terminal_smoke.py
      - name: Eval smoke - fixture harness metrics
        timeout-minutes: 10
        run: python3 alfredo-tui/tests/eval_smoke.py

  # Release archive and installed-release smoke: always on main and manual runs;
  # on PRs only when packaging inputs change.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether packaging needs checking
        id: need
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -Eq '^(alfredo-tui/(Cargo\.toml|Cargo\.lock|INSTALL\.md|scripts/[^/]+\.py|tests/release_smoke\.py)|\.github/workflows/rust-terminal\.yml|LICENSE$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
            echo "Packaging inputs unchanged; release packaging runs on main after merge."
          fi
      - if: steps.need.outputs.run == 'true'
        name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - if: steps.need.outputs.run == 'true'
        name: Cache Cargo registry, dependencies and tools
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: alfredo-tui -> target
          cache-bin: true
      - if: steps.need.outputs.run == 'true'
        name: Install worker sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          # Ubuntu 24.04 AppArmor blocks unprivileged user namespaces that bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user --unshare-pid --unshare-net true
      - if: steps.need.outputs.run == 'true'
        name: Fetch locked dependencies
        # package_release.py reads crate metadata offline, so sources must be present.
        run: cargo fetch --locked --manifest-path "$MANIFEST"
      - if: steps.need.outputs.run == 'true'
        name: Package release archive
        run: python3 alfredo-tui/scripts/package_release.py --output alfredo-tui/dist
      - if: steps.need.outputs.run == 'true'
        name: Installed release smoke
        timeout-minutes: 20
        run: python3 alfredo-tui/tests/release_smoke.py alfredo-tui/dist/*.tar.gz
      - if: steps.need.outputs.run == 'true'
        name: Retain verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: alfredo-terminal-linux-x86_64-candidate
          path: alfredo-tui/dist/*
          if-no-files-found: error

  # Single gate with the old job name, so `terminal` stays the check to look at.
  terminal:
    if: always()
    needs: [checks, smokes, release]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "checks/smokes/release: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
